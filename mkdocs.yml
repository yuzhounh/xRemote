site_name: xRemote 使用手册
site_description: xRemote 中文图文教程：安装升级、连接管理、启动器、协议设置与数据备份。
site_url: https://yuzhounh.github.io/xRemote/
repo_url: https://github.com/yuzhounh/xRemote
repo_name: yuzhounh/xRemote
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: tmp/docs-site
use_directory_urls: true
theme:
  name: material
  language: zh
  font: false
  logo: assets/xremote.svg
  favicon: assets/xremote.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
plugins:
  - search:
      lang: en
nav:
  - 手册首页: README.md
  - 安装与升级: installation.md
  - 快速开始: quick-start.md
  - 连接编辑: connection-editing.md
  - 启动器与会话: launcher-and-sessions.md
  - 外部运行器与参数宏: external-runners.md
  - 数据与凭据: data-and-credentials.md
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
copyright: xRemote · 基于 1Remote 开发
