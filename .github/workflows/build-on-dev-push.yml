name: Build xRemote Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply xRemote dependency patch
        shell: pwsh
        run: ./scripts/Prepare-Dependencies.ps1
      - name: Build portable Windows x64 app
        shell: pwsh
        run: |
          dotnet publish Ui/Ui.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item artifacts/publish/1Remote.exe xRemote.App.exe
          New-Item artifacts/publish/FORCE_INTO_PORTABLE_MODE -ItemType File
      - uses: actions/upload-artifact@v4
        with:
          name: xRemote-windows-x64
          path: artifacts/publish/
          if-no-files-found: error
